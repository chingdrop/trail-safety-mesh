---
# roles/meshtasticd/tasks/main.yml
#
# Installs the Linux-native Meshtastic daemon. The exact install method
# on Ubuntu 24.04 (arm64) with a RAK6421 + RAK13300 HAT is not pinned
# at the time of writing -- the upstream project distributes meshtasticd
# via OBS (openSUSE Build Service) repos, and the right branch/tag pair
# changes over time. Treat the steps below as a scaffold and verify
# against upstream docs before each real deployment.
#
# References to confirm (TODO):
#   - https://meshtastic.org/docs/hardware/devices/linux-native-hardware/
#   - https://github.com/meshtastic/firmware (meshtasticd subdir)
#   - The OBS download.opensuse.org repo URL for noble + arm64.
#
# This file deliberately uses ansible.builtin.debug + when: false blocks
# in places where the upstream commands would normally run, so a
# misconfigured run doesn't trash a working host.

- name: TODO -- meshtasticd install path is not pinned
  ansible.builtin.debug:
    msg: |
      The meshtasticd role is a scaffold. Before deploying to real
      hardware, confirm and uncomment the apt repo + package install
      block below. Until then, this role only deploys config (if asked)
      and sets group memberships; it does not install meshtasticd itself.

