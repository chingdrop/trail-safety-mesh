---
# roles/meshtasticd/tasks/main.yml
#
# Installs and configures the Linux-native Meshtastic daemon for the
# RAK6421 + RAK13300 (SX1262) HAT on a Raspberry Pi 4.
#
# Install source: the Meshtastic project's Ubuntu PPA. Confirmed
# working on Ubuntu 24.04 arm64 as ppa:meshtastic/beta.
#
# Radio config: meshtasticd reads hardware drop-ins from
# /etc/meshtasticd/config.d/. This role writes one drop-in for the
# RAK6421+RAK13300 slot-1 wiring, templated from known-good values in
# defaults/main.yml. It does NOT manage region / channels / identity --
# those are set through meshtasticd or a Meshtastic client.
#
# Prerequisite: SPI must be enabled and the operator user must be in
# the spi/gpio/i2c groups. That is the pi_hardware role's job and is
# gated there by meshtasticd_rak_hat_present.

# ---------------------------------------------------------------------
# Package install from the Meshtastic PPA.
# ---------------------------------------------------------------------

- name: Ensure software-properties-common is present (for add-apt-repository)
  ansible.builtin.apt:
    name: software-properties-common
    state: present
  when: meshtasticd_install_package | bool

- name: Add the Meshtastic PPA
  ansible.builtin.apt_repository:
    repo: "{{ meshtasticd_apt_ppa }}"
    state: present
    update_cache: true
  when: meshtasticd_install_package | bool

- name: Install meshtasticd
  ansible.builtin.apt:
    name: meshtasticd
    state: present
  when: meshtasticd_install_package | bool

# ---------------------------------------------------------------------
# Radio hardware drop-in under config.d/.
# ---------------------------------------------------------------------

- name: Ensure /etc/meshtasticd/config.d exists
  ansible.builtin.file:
    path: /etc/meshtasticd/config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: meshtasticd_manage_radio_config | bool

- name: Deploy RAK6421 + RAK13300 radio drop-in
  ansible.builtin.template:
    src: lora-rak.yaml.j2
    dest: "/etc/meshtasticd/config.d/{{ meshtasticd_radio_config_filename }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: meshtasticd_manage_radio_config | bool
  notify: Restart meshtasticd

# ---------------------------------------------------------------------
# Service enablement. Only act if the unit actually exists -- on a run
# where meshtasticd_install_package is false and the package was never
# installed, there is nothing to enable.
# ---------------------------------------------------------------------

- name: Check whether the meshtasticd systemd unit exists
  ansible.builtin.stat:
    path: "/lib/systemd/system/{{ meshtasticd_service_name }}.service"
  register: meshtasticd_unit

- name: Ensure meshtasticd is enabled and running
  ansible.builtin.systemd:
    name: "{{ meshtasticd_service_name }}"
    enabled: true
    state: started
  when: meshtasticd_unit.stat.exists
