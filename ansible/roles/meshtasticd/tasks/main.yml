# ---------------------------------------------------------------------
# Config template
# ---------------------------------------------------------------------

- name: Ensure /etc/meshtasticd exists before templating config
  ansible.builtin.file:
    path: /etc/meshtasticd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: meshtasticd_manage_config | bool

- name: Deploy meshtasticd config (when meshtasticd_manage_config is true)
  ansible.builtin.template:
    src: meshtasticd.config.yaml.j2
    dest: /etc/meshtasticd/config.yaml
    owner: root
    group: root
    mode: "0640"
    backup: true
  when: meshtasticd_manage_config | bool
  notify: Restart meshtasticd

# ---------------------------------------------------------------------
# Service enablement -- only when the unit actually exists.
# ---------------------------------------------------------------------

- name: Check if meshtasticd systemd unit exists
  ansible.builtin.stat:
    path: "/lib/systemd/system/{{ meshtasticd_service_name }}.service"
  register: meshtasticd_unit

- name: Ensure meshtasticd is enabled and running
  ansible.builtin.systemd:
    name: "{{ meshtasticd_service_name }}"
    enabled: true
    state: started
  when: meshtasticd_unit.stat.exists
