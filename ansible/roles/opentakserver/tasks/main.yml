---
# roles/opentakserver/tasks/main.yml
#
# Pre-install everything the OpenTAKServer (OTS) installer expects.
# The OTS installer itself is interactive (CA fields, admin password,
# MediaMTX yes/no) and downloads code from a third-party URL we don't
# control. Run it manually after this playbook:
#
#   curl -s -L https://i.opentakserver.io/ubuntu_installer | bash -
#
# Why we pre-install:
#   The OTS installer has no error handling. If apt can't resolve a
#   dependency, the installer keeps going and prints "Installed!" at
#   the end whether anything actually worked. Pre-installing every
#   prerequisite via Ansible means the installer's only remaining job
#   is OTS-specific (venv contents, CA cert, systemd units), which is
#   easier to verify after the fact.
#
# Broker model: this build runs no standalone MQTT broker. RabbitMQ,
# installed here as an OTS dependency, is the only broker. It carries
# OTS-internal AMQP on 5672/tcp and -- when OTS Meshtastic support is
# enabled -- the Meshtastic ServiceEnvelope ingestion path on the
# amq.topic exchange. OTS owns RabbitMQ's plugin configuration,
# including whether rabbitmq_mqtt is enabled; this role does not force
# that plugin on or off. See docs/decisions/0002-no-standalone-mqtt-broker.md.

- name: Install OTS Python toolchain packages
  ansible.builtin.apt:
    name: "{{ opentakserver_py_packages }}"
    state: present
  when: opentakserver_install_prereqs | bool

- name: Install OTS build toolchain packages
  ansible.builtin.apt:
    name: "{{ opentakserver_build_packages }}"
    state: present
  when: opentakserver_install_prereqs | bool

- name: Install OTS service-dependency packages
  ansible.builtin.apt:
    name: "{{ opentakserver_service_packages }}"
    state: present
  when: opentakserver_install_prereqs | bool

# ---------------------------------------------------------------------
# Service liveness sanity-check on what we just installed.
# ---------------------------------------------------------------------

- name: Verify OTS service-dependency packages are running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ opentakserver_service_packages }}"
  when: opentakserver_install_prereqs | bool

- name: Print next-step reminder
  ansible.builtin.debug:
    msg: |
      OpenTAKServer prerequisites are installed. To install OTS itself:

          curl -s -L https://i.opentakserver.io/ubuntu_installer | bash -

      The installer is interactive; save the admin password it generates
      in your password manager. After it finishes, verify with:

          systemctl is-active opentakserver cot_parser eud_handler eud_handler_ssl mediamtx

      Broker note: this build runs no standalone MQTT broker, so the OTS
      installer is free to configure RabbitMQ (including its MQTT plugin)
      however it needs. There is no Mosquitto to collide with on
      1883/tcp. See docs/decisions/0002-no-standalone-mqtt-broker.md.
