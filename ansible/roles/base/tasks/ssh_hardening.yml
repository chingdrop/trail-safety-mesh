---
# Drop in 01-local-hardening.conf to disable password auth, disable X11
# forwarding, and set idle disconnect.
#
# IMPORTANT: sshd_config.d uses FIRST-WINS for duplicate keys (opposite
# of most Linux configs). The file is named 01- so it parses BEFORE
# 50-cloud-init.conf, which would otherwise re-enable password auth.
#
# We refuse to apply this if authorized_keys is empty -- the previous
# task should already have failed in that case, but defence in depth.

- name: Check that authorized_keys exists and is non-empty for the operator user
  ansible.builtin.stat:
    path: "/home/{{ field_gateway_user }}/.ssh/authorized_keys"
  register: authorized_keys_stat

- name: Refuse to harden SSH without a working authorized_keys file
  ansible.builtin.fail:
    msg: >-
      /home/{{ field_gateway_user }}/.ssh/authorized_keys is missing or
      empty. Disabling password auth now would lock you out. Verify the
      ssh_key task completed successfully first.
  when:
    - not authorized_keys_stat.stat.exists or authorized_keys_stat.stat.size == 0

- name: Deploy sshd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-local-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (trail-safety-mesh / roles/base).
      #
      # sshd_config.d uses FIRST-WINS precedence. This file is 01- so it
      # parses BEFORE 50-cloud-init.conf, which would otherwise re-enable
      # password auth.
      #
      # Goal: key-only SSH, no X11, drop idle clients on flaky links.

      PasswordAuthentication no
      X11Forwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 3
  notify: Reload ssh

- name: Validate sshd config (sshd -t)
  ansible.builtin.command: sshd -t
  changed_when: false
