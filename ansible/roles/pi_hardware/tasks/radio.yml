---
# roles/pi_hardware/tasks/radio.yml
#
# Bus enablement for the RAK6421 + RAK13300 LoRa HAT on a Raspberry
# Pi 4 running Ubuntu Server 24.04. Included from main.yml only when
# meshtasticd_rak_hat_present is true.
#
# Ubuntu Server on the Pi uses /boot/firmware/config.txt (not Raspberry
# Pi OS's /boot/config.txt). The RAK13300 (SX1262) is an SPI device; it
# needs the SPI bus enabled. I2C/UART are enabled here too because the
# RAK6421 baseboard exposes them and other RAK modules / sensors may use
# them; they are cheap to leave on and match how the reference unit was
# brought up.
#
# Pin-level wiring (IRQ/Reset/Busy/SPI dev) is NOT set here -- that is
# the meshtasticd config.d drop-in's job (roles/meshtasticd). This file
# only turns the buses on.
#
# Any change here notifies "Reboot required note": config.txt changes
# do not take effect until the Pi reboots.

- name: Ensure SPI is enabled in /boot/firmware/config.txt
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^#?\s*dtparam=spi='
    line: 'dtparam=spi=on'
    state: present
  notify: Reboot required note

- name: Ensure I2C is enabled in /boot/firmware/config.txt
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^#?\s*dtparam=i2c_arm='
    line: 'dtparam=i2c_arm=on'
    state: present
  notify: Reboot required note

- name: Ensure the primary UART is enabled in /boot/firmware/config.txt
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^#?\s*enable_uart='
    line: 'enable_uart=1'
    state: present
  notify: Reboot required note

# Note on group membership: the operator user is added to the
# spi/gpio/i2c groups by main.yml (the "radio HAT groups" task), which
# is gated on the same meshtasticd_rak_hat_present flag that includes
# this file. No group work is repeated here.
